<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/site-logo.png" />
    <!-- viewport-fit=cover lets content render edge-to-edge on notched
         devices (needed once this ships as a Capacitor app) and makes
         env(safe-area-inset-*) actually resolve to non-zero values —
         without it, Safari/WebView keeps content inset automatically and
         the safe-area padding below would just be dead weight. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>The Fame Exchange — Trade Branded Talent Shares</title>

    <!-- SEO -->
    <meta name="description" content="The world's first talent trading platform. Buy, sell and trade Branded Talent Shares of your favourite creators and celebrities." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.thefameexchange.com" />
    <meta property="og:title" content="The Fame Exchange" />
    <meta property="og:description" content="Buy, sell and trade Branded Talent Shares of your favourite creators and celebrities." />
    <meta property="og:image" content="https://app.thefameexchange.com/og-preview.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@thefameexchange" />
    <meta name="twitter:title" content="The Fame Exchange" />
    <meta name="twitter:description" content="Buy, sell and trade Branded Talent Shares of your favourite creators and celebrities." />
    <meta name="twitter:image" content="https://app.thefameexchange.com/og-preview.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
